<ion-content class="ion-padding">
  <div class="signup-container">
    <div class="signup-header">
      <ion-icon name="person-add-outline" class="signup-icon"></ion-icon>
      <h1>Crear cuenta</h1>
      <p>Completá tus datos para registrarte</p>
    </div>

    <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" novalidate>
      <ion-item lines="outline">
        <ion-input
          type="text"
          formControlName="name"
          label="Name"
          labelPlacement="floating"
          placeholder="Jose"
        ></ion-input>
      </ion-item>

      <ion-item lines="outline">
        <ion-input
          type="email"
          formControlName="email"
          label="Email"
          labelPlacement="floating"
          placeholder="tucorreo@ejemplo.com"
        ></ion-input>
      </ion-item>
      <div class="error-msg" *ngIf="emailInvalid">
        Ingresá un correo válido.
      </div>

      <ion-item lines="outline">
        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          label="Contraseña"
          labelPlacement="floating"
          placeholder="Mínimo 8 caracteres"
        ></ion-input>
        <ion-button fill="clear" slot="end" (click)="togglePassword()">
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </ion-button>
      </ion-item>
      <div class="error-msg" *ngIf="passwordInvalid">Mínimo 8 caracteres.</div>

      <ion-item lines="outline">
        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          label="Confirmar contraseña"
          labelPlacement="floating"
          placeholder="Repetí tu contraseña"
        ></ion-input>
      </ion-item>
      <div class="error-msg" *ngIf="confirmInvalid">
        Las contraseñas no coinciden.
      </div>

      <div class="error-server" *ngIf="serverError">{{ serverError }}</div>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="loading"
        class="signup-btn"
      >
        <span *ngIf="!loading">Crear cuenta</span>
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
      </ion-button>
    </form>

    <div class="signin-link">
      <ion-text>¿Ya tenés cuenta? </ion-text>
      <ion-text color="primary">
        <a style="cursor: pointer" (click)="goToSignIn()">Iniciá sesión</a>
      </ion-text>
    </div>
  </div>
</ion-content>
