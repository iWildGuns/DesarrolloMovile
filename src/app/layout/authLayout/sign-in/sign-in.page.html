<ion-content class="ion-padding">
  <div class="login-container">
    <div class="login-header">
      <ion-icon name="person-circle-outline" class="login-icon"></ion-icon>
      <h1>Bienvenido</h1>
      <p>Iniciá sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="login-form">
        <ion-item lines="outline" class="login-item">
          <ion-input
            type="email"
            formControlName="email"
            label="Email"
            labelPlacement="floating"
            placeholder="tucorreo@ejemplo.com"
          ></ion-input>
        </ion-item>
        <div class="error-msg" *ngIf="emailInvalid">
          Ingresá un correo válido.
        </div>

        <ion-item lines="outline" class="login-item">
          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            label="Contraseña"
            labelPlacement="floating"
            placeholder="••••••••"
          ></ion-input>
          <ion-button fill="clear" slot="end" (click)="togglePassword()">
            <ion-icon
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </ion-button>
        </ion-item>
        <div class="error-msg" *ngIf="passwordInvalid">
          La contraseña es obligatoria.
        </div>

        <div class="error-server" *ngIf="serverError">{{ serverError }}</div>

        <div class="forgot-password">
          <ion-text color="primary">
            <a (click)="forgotPassword()">¿Olvidaste tu contraseña?</a>
          </ion-text>
        </div>

        <ion-button
          expand="block"
          type="submit"
          [disabled]="loading"
          class="login-btn"
        >
          <span *ngIf="!loading">Iniciar Sesión</span>
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        </ion-button>

        <div class="divider">
          <span>o continuá con</span>
        </div>

        <ion-button
          expand="block"
          fill="outline"
          (click)="loginWithGoogle()"
          class="google-btn"
        >
          <ion-icon slot="start" name="logo-google"></ion-icon>
          Continuar con Google
        </ion-button>

        <div class="register-link">
          <ion-text>¿No tenés cuenta? </ion-text>
          <ion-text color="primary">
            <a (click)="goToRegister()">Registrate</a>
          </ion-text>
        </div>
      </div>
    </form>
  </div>
</ion-content>
