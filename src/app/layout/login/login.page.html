<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon
            points="10,2 18,7 18,13 10,18 2,13 2,7"
            fill="none"
            stroke="#7F77DD"
            stroke-width="1.5"
          />
          <polygon
            points="10,5 15,8 15,12 10,15 5,12 5,8"
            fill="#7F77DD"
            opacity="0.4"
          />
          <circle cx="10" cy="10" r="2" fill="#7F77DD" />
        </svg>
      </div>
      <span class="login-appname">MiApp</span>
    </div>

    <h1 class="login-title">Bienvenido de nuevo</h1>
    <p class="login-subtitle">Ingresá tus datos para continuar</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <div class="input-wrapper">
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="usuario@correo.com"
            [class.error]="emailInvalid"
            autocomplete="email"
          />
          <i class="ti ti-mail field-icon" aria-hidden="true"></i>
        </div>
        <span class="error-msg" *ngIf="emailInvalid">
          Ingresá un correo válido.
        </span>
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            [class.error]="passwordInvalid"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <i
              [class]="showPassword ? 'ti ti-eye-off' : 'ti ti-eye'"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <span class="error-msg" *ngIf="passwordInvalid">
          La contraseña es obligatoria.
        </span>
      </div>
      <a routerLink="/forgot-password" class="forgot-link"
        >¿Olvidaste tu contraseña?</a
      >

      <div class="server-error" *ngIf="serverError">
        <i class="ti ti-alert-circle" aria-hidden="true"></i>
        {{ serverError }}
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading" class="btn-loading">
          <i class="ti ti-loader-2 spin" aria-hidden="true"></i> Ingresando...
        </span>
      </button>
    </form>

    <div class="divider"><span>o continuá con</span></div>

    <div class="oauth-row">
      <button type="button" class="oauth-btn" (click)="loginWithGoogle()">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          />
        </svg>
        Google
      </button>

      <button type="button" class="oauth-btn" (click)="loginWithGithub()">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
          />
        </svg>
        GitHub
      </button>
    </div>

    <p class="signup-link">
      ¿No tenés cuenta? <a routerLink="/register">Registrate</a>
    </p>
  </div>
</div>
