<ion-menu [contentId]="contentId" [menuId]="menuId">
  <div>
    <ion-toolbar>
      <ion-title>Menu Content</ion-title>
    </ion-toolbar>
    <ion-list>
      <ion-item (click)="navegarACotizaciones()">
        <ion-label>Cotizacion de moneda</ion-label>
      </ion-item>
      <ion-item (click)="navegarADivisas()">
        <ion-label>Todas las currencys el dia de hoy</ion-label>
      </ion-item>
      <ion-item (click)="navegarACotizacionesEntreFechas()">
        <ion-label>Divisa por rango de fechas</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Comparar divisa</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Otra opcion</ion-label>
      </ion-item>
    </ion-list>
  </div>
  <ion-list (click)="navegarALogin()">
    <ion-item>
      <ion-label>Iniciar sesion</ion-label>
    </ion-item>
  </ion-list>
</ion-menu>
