<ion-menu [contentId]="contentId" [menuId]="menuId">
  <div>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
    <ion-list>
      <ion-item (click)="navegarACotizaciones()">
        <ion-label>Cotizacion de divisa</ion-label>
      </ion-item>
      <ion-item (click)="navegarADivisas()">
        <ion-label>Todas las divisas el día de hoy</ion-label>
      </ion-item>
      <ion-item (click)="navegarACotizacionesEntreFechas()">
        <ion-label>Divisa por rango de fechas</ion-label>
      </ion-item>
      <ion-item (click)="navegarACurrencyConverter()">
        <ion-label>Conversor de divisas</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Comparar divisa</ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Otra opcion</ion-label>
      </ion-item>
    </ion-list>
  </div>

  <ion-list lines="none">
    <ion-item>
      <ion-icon slot="start" [name]="themeService.isDarkMode() ? 'moon' : 'sunny'"></ion-icon>
      <ion-label>Modo Oscuro</ion-label>
      <ion-toggle slot="end" [checked]="themeService.isDarkMode()" (ionChange)="themeService.toggleTheme()">
      </ion-toggle>
    </ion-item>
    @if (isLoggedIn$ | async) {
    <ion-item button (click)="handleAuthAction(true)" detail="false" lines="none">
      <!-- <ion-icon slot="end" name="log-out-outline" color="danger"></ion-icon> -->
      <ion-label color="danger">Cerrar Sesión</ion-label>
    </ion-item>
    }
  </ion-list>

  <!-- @else {
    <ion-item
      button
      (click)="handleAuthAction(false)"
      detail="false"
      lines="none"
    > -->
  <!-- <ion-icon slot="end" name="log-in-outline" color="success"></ion-icon> -->
  <!-- <ion-label color="success">Log In / Sign Up</ion-label>
    </ion-item>
  } -->
</ion-menu>
