<ion-header>
  <ion-toolbar>
    <ion-title>Cotizaciones entre dos fechas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-item>
    <ion-label position="stacked">Moneda</ion-label>

    <ion-select [(ngModel)]="moneda">
      <ion-select-option value="EUR">EUR</ion-select-option>
      <ion-select-option value="USD">USD</ion-select-option>
      <ion-select-option value="BRL">BRL</ion-select-option>
    </ion-select>
  </ion-item>
  
  <ion-item>
    <ion-label position="stacked">Fecha desde</ion-label>
    
    <ion-input
    type="date"
    [(ngModel)]="fechaDesde">
  </ion-input>
</ion-item>

<ion-item>
  <ion-label position="stacked">Fecha hasta</ion-label>
  
  <ion-input
  type="date"
  [(ngModel)]="fechaHasta">
</ion-input>
</ion-item>

<ion-button expand="block" (click)="buscarCotizaciones()">
  Buscar
</ion-button>

<ion-list>
  <div *ngFor="let day of data?.results">
    
    <ion-item color="light">
      <ion-label>
        <h2>{{ day.fecha }}</h2>
      </ion-label>
    </ion-item>
    
    <ion-item *ngFor="let d of day.detalle">
      <ion-label>
        <h3>{{ d.codigoMoneda }}</h3>
        <p>{{ d.descripcion }}</p>
        <p>Pase: {{ d.tipoPase }}</p>
        <p>Cotización: {{ d.tipoCotizacion }}</p>
      </ion-label>
    </ion-item>
    
  </div>
</ion-list>
</ion-content>
